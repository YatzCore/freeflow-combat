plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { name = 'KosmX (playerAnimator)'; url = 'https://maven.kosmx.dev/' }
	maven { name = 'Shedaniel (Cloth Config)'; url = 'https://maven.shedaniel.me/' }
	maven { name = 'TerraformersMC (ModMenu)'; url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"freeflow" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Dedicated dev server for multiplayer tests (its own folder, so it doesn't clash with the client).
		server {
			runDir "run-server"
		}
		// Headless automated in-game tests: ./gradlew runGametest
		gametest {
			inherit server
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
		}
	}
}

configurations {
	productionRuntimeMods
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Player keyframe animations (punches, kicks, counters, vaults)
	modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}"
	include "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}"

	// Config + config screen
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// Bundled (LGPL), so players only need Fabric API next to this mod.
	include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mods for the production-jar test (./gradlew prodServer): the built jar plus what players install.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modApi "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// Runs the real release jar on a production Fabric server (not the dev classpath): ./gradlew prodServer
tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	installerVersion = "1.0.1"
	mods.from(configurations.productionRuntimeMods)
	mods.from(tasks.named("remapJar"))
	runDir = file("run-prod")
}
